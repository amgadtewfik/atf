[project]
name = "atf"
version = "0.21.0"
description = "Adaptive Tensor Format - Dynamic MoE model with Graphic LOD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gguf>=0.10",
    "click>=8.0",
    "rich>=13.0",
    "mlx>=0.21",
    "transformers>=4.51",
    "gigatoken==0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.7.0"]
torch = ["torch>=2.0"]

[project.scripts]
atf = "atf.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atf*"]
